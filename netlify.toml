# organizationalamnesia.com now lives at https://reattend.com/amnesia
# (moved 2026-09-12). This site only redirects: every old page 301s to its
# exact new URL, so any ranking or backlink a page earned follows it.
#
# The rules are host-agnostic, so any domain attached to this Netlify site
# (www, the en-GB organisationalamnesia.com, corporateamnesia.com) gets the
# same page-for-page mapping once it is added as a domain alias.
#
# force = true makes the redirects win over the static files still in this
# repo. Those files are kept as an archive only and are never served.

[build]
  publish = "."

[[redirects]]
  from = "/"
  to = "https://reattend.com/amnesia"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "https://reattend.com/amnesia"
  status = 301
  force = true

