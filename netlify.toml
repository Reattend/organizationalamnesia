  from = "/team.html"
  to = "https://reattend.com/amnesia/about"
  status = 301
  force = true

[[redirects]]
  from = "/sitemap.xml"
  to = "https://reattend.com/sitemap.xml"
  status = 301
  force = true

# Everything else, including the old llms.txt, lands on the section home.
[[redirects]]
  from = "/*"
  to = "https://reattend.com/amnesia"
  status = 301
  force = true
